    original: The hypothesis and null hypothesis are correctly formulated, clearly linked, and fully testable. Variables are explicitly named, the predicted relationship is clearly stated, and the null hypothesis explicitly states the absence of that relationship as a logical counterpart. (2 marks)
    observable:
    - 'Heading 1 names all four PICO elements: the population (Australians aged 18–30 who do not own a home), the social-media exposure or condition, what it is compared with, and a measurable outcome about housing-crisis perceptions.'
    - 'The predicted relationship is explicit: a direction word (higher, lower, greater, fewer) or ''will differ from''. Directional wording is used only where a reason for the direction exists.'
    - Heading 2 uses the same population and variables as heading 1 and states no difference or no association between them, as an exact logical counterpart.
    - The outcome is measurable with the instrument in heading 4 and testable with the test named in heading 5.
    - Neither statement contains 'significant', 'significantly' or 'statistically significant'.
    sources:
    - inputs/rubric/task-b-rubric.md#line.6
    - inputs/spec/task-b-spec.md#line.5
    - inputs/spec/task-b-spec.md#line.9
    - inputs/spec/task-b-spec.md#line.10
