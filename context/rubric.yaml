  evidence:
  - text: A dollar figure (or itemised costs) within AUD 1,000 and an hour figure (or allocation) within 100 hours.
    source: inputs/spec/task-b-spec.md#line.12
  - text: Sampling strategy, recruitment approach, location, equipment and processes are each identifiable.
    source: inputs/rubric/task-b-rubric.md#line.8
  - text: The data described would measure the variables in heading 3.
    source: inputs/rubric/task-b-rubric.md#line.8
  - text: Practical detail on how the data would be obtained, not just what data.
    source: inputs/spec/task-b-spec.md#line.12
  pitfalls:
  - text: Leaving out the AUD 1,000 budget or the 100 hours. The rubric's C level is defined by 'No reference to the $1000 budget and the time allocation', so this caps the criterion at 1.25/2 even for a detailed plan.
    source: inputs/rubric/task-b-rubric.md#line.8
  - text: Mentioning the budget without integrating it into the plan. That is the D-level descriptor.
    source: inputs/rubric/task-b-rubric.md#line.8
  - text: A plan that is infeasible for one person in 100 hours, such as a nationally representative sample or paid panel costs above budget.
    source: inputs/rubric/task-b-rubric.md#line.8
  - text: Describing what was done without justifying why. Staff flagged this in A1 feedback and said it carries over.
    source: inputs/clarifications/task-b-additional-info.md#line.54
  - text: Going over the 100-word limit (resolved per OQ1). Words past the limit are not marked.
    source: inputs/spec/task-b-spec.md#line.32
- id: C4
  name: Statistical Analysis
  original_wording: Statistical Analysis (2 marks)
  original_source: inputs/rubric/task-b-rubric.md#line.9
  weight: 2
  applies_to:
  - TB
  cross_cutting: false
  headings: '5'
  learning_outcomes:
  - ULO4
  levels:
  - level: HD
    marks:
    - 2
    - 2
    original: Appropriate tests are named, relevant to the hypothesis, and data assumptions are clearly identified. A plausible explanation is provided for why each test is appropriate for the variable types and research design, and how results would be interpreted. (2 marks)
    observable:
    - 'Test choice: the test(s) are named and suit the measurement level of the IV and DV and the design (e.g. two independent groups with a numeric outcome suggests an independent-samples or Welch''s t-test).'
    - 'Relevance: each test directly tests H0 from heading 2.'
    - 'Assumptions: the data assumptions are identified specifically (e.g. independence, distribution shape, equal or unequal variances, measurement level), and the answer says how they affect the test choice or what would be done if one fails.'
    - 'Justification and interpretation: the answer explains why each test fits the variable types and design, and how a result would be read (e.g. the decision rule for rejecting H0 and what that means for the hypothesis).'
    sources:
    - inputs/rubric/task-b-rubric.md#line.9
    - inputs/spec/task-b-spec.md#line.13
    - inputs/clarifications/Assignment-2-faq.md#line.69
    - inputs/clarifications/task-b-additional-info.md#line.10
    - inputs/clarifications/task-b-additional-info.md#line.67
    - inputs/clarifications/task-b-additional-info.md#line.108
  - level: D
    marks:
    - 1.5
    - 1.5
    original: Appropriate tests are named and relevant to the hypothesis. Some data assumptions are identified, but the explanation of why the tests suit this topic is not fully developed. (1.5 marks)
    observable:
    - 'Test choice: appropriate tests are named.'
    - 'Relevance: relevant to the hypothesis.'
    - 'Assumptions: some assumptions are identified.'
    - 'Justification and interpretation: the explanation of why the tests suit this topic or design is not fully developed, or interpretation is missing.'
    sources:
    - inputs/rubric/task-b-rubric.md#line.9
    - inputs/clarifications/Assignment-2-faq.md#line.69
  - level: C
    marks:
    - 1.25
    - 1.25
    original: Appropriate tests are named and are relevant to the hypothesis. Data assumptions are not addressed and no explanation is provided for why the tests are appropriate. (1.25 marks)
    observable:
    - 'Test choice: appropriate tests are named.'
    - 'Relevance: relevant to the hypothesis.'
    - 'Assumptions: data assumptions are not addressed.'
    - 'Justification and interpretation: no explanation of why the tests are appropriate.'
    sources:
    - inputs/rubric/task-b-rubric.md#line.9
  - level: P
    marks:
    - 1
    - 1
    original: Tests are named, but are not appropriate for the variable types or hypothesis. Data assumptions are not addressed and no reasoning is given for why the tests are suitable. (1 mark)
    observable:
    - 'Test choice: tests are named but do not suit the variable types or the hypothesis.'
    - 'Relevance: weak or absent.'
    - 'Assumptions: not addressed.'
    - 'Justification and interpretation: no reasoning given.'
    sources:
