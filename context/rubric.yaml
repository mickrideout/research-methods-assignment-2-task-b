    original: A hypothesis and/or null hypothesis is provided, but is incorrectly structured, not clearly testable, or not relevant to the topic. The null hypothesis may not logically correspond to the alternative hypothesis. (1 mark)
    observable:
    - 'At least one statement is wrongly structured: a question instead of a prediction, a statement of fact, or several predictions bundled together.'
    - There is no testable prediction, or the topic is missed (not young non-homeowning Australians, social media or housing perceptions).
    - H0 is not the logical counterpart of H1 (e.g. it states the opposite direction or names different variables).
    - No measurable outcome is stated.
    - Pass level requires at least an attempted hypothesis or null hypothesis.
