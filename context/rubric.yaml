- id: C3
  name: Data Collection
  original_wording: Data Collection (2 marks)
  original_source: inputs/rubric/task-b-rubric.md#line.8
  weight: 2
  applies_to:
  - TB
  cross_cutting: false
  headings: '4'
  learning_outcomes:
  - ULO1
  - ULO4
  levels:
  - level: HD
    marks:
    - 2
    - 2
    original: A feasible and clearly described data collection plan that is closely related to the hypothesis. Sampling strategy, recruitment approach, location, equipment, and processes are all outlined within a realistic $\$1000$ budget and the $100\text{ hour}$ time allocation. (2 marks)
    observable:
    - 'Feasibility: the plan could be run by one person within the stated resources.'
    - 'Practical detail: the sampling strategy (target sample and inclusion of 18–30-year-old non-homeowners), the recruitment approach, the location (online or physical), the equipment or instruments (e.g. survey platform, named scales) and the process steps are all stated.'
    - 'Link to hypothesis: the data collected measure the IV, the DV and the confounders from heading 3.'
    - 'Budget and time: costs are itemised and total no more than AUD 1,000, and hours are allocated to stages and total no more than 100. Both are integrated into the plan, not just mentioned.'
    sources:
    - inputs/rubric/task-b-rubric.md#line.8
    - inputs/spec/task-b-spec.md#line.12
    - inputs/spec/task-b-spec.md#line.5
  - level: D
    marks:
    - 1.5
    - 1.5
    original: A feasible and practically detailed plan is described with clear relevance to the hypothesis. Sampling, recruitment, processes, and equipment are addressed, but the $\$1000$ budget and the $100\text{ hour}$ time allocation are not clearly integrated into the plan. (1.5 marks)
    observable:
    - 'Feasibility: feasible.'
    - 'Practical detail: sampling, recruitment, processes and equipment are all addressed.'
    - 'Link to hypothesis: clearly relevant to the hypothesis.'
    - 'Budget and time: the AUD 1,000 and 100 hours are mentioned but not clearly integrated (e.g. no cost or hour breakdown, or figures not tied to plan steps).'
    sources:
    - inputs/rubric/task-b-rubric.md#line.8
    - inputs/spec/task-b-spec.md#line.12
  - level: C
    marks:
    - 1.25
    - 1.25
    original: A feasible method is described and linked to the hypothesis. The plan is general and lacks practical detail on sampling, recruitment, processes, or equipment. No reference to the $\$1000$ budget and the time allocation ($100\text{ hours}$). (1.25 marks)
    observable:
    - 'Feasibility: feasible.'
    - 'Practical detail: general. At least one of sampling, recruitment, processes or equipment lacks practical detail.'
    - 'Link to hypothesis: linked to the hypothesis.'
    - 'Budget and time: neither the AUD 1,000 budget nor the 100-hour allocation is referred to.'
    sources:
    - inputs/rubric/task-b-rubric.md#line.8
  - level: P
    marks:
    - 1
    - 1
    original: A data collection method is described, but it is not feasible, OR not related to the hypothesis, OR makes no reference to the $\$1000$ budget and the time allocated ($100\text{ hours}$). (1 mark)
    observable:
    - 'Feasibility: a method is described but is not feasible (e.g. it needs more than AUD 1,000 or 100 hours, or the sample is unobtainable).'
    - 'Practical detail: may be minimal.'
    - 'Link to hypothesis: OR the method is unrelated to the hypothesis.'
    - 'Budget and time: OR there is no reference to the budget and time allocation.'
