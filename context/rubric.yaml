  evidence:
  - text: 'Heading 1 can be read as a PICO sentence: population, intervention or exposure, comparison, and outcome.'
    source: inputs/clarifications/task-b-additional-info.md#line.86
  - text: Heading 1 is something that can realistically be tested with a statistical test covered in the unit, and heading 5 names that test.
    source: inputs/spec/task-b-spec.md#line.9
  - text: Heading 2 states 'no difference' or 'no association' using the same variables as heading 1.
    source: inputs/clarifications/task-b-additional-info.md#line.94
  - text: 'The population matches the spec''s definition: aged 18–30 and does not yet own a home.'
    source: inputs/spec/task-b-spec.md#line.5
  - text: Heading 1 is within 50 words and heading 2 is within 50 words.
    source: inputs/spec/task-b-spec.md#line.9
  pitfalls:
  - text: Writing 'significantly higher' or 'statistically significant' in the hypothesis. Significance is a conclusion from the test, not a prediction.
    source: inputs/clarifications/task-b-additional-info.md#line.91
  - text: Giving a direction (higher or lower) with no reason to expect it. Use 'will differ from' when there is no basis for a direction.
    source: inputs/clarifications/task-b-additional-info.md#line.88
  - text: Defining the population loosely (e.g. 'young people' or 'Gen Z') instead of Australians aged 18–30 who do not own a home.
    source: inputs/spec/task-b-spec.md#line.5
  - text: H0 that is not the counterpart of H1, for example one that predicts the opposite direction instead of no difference.
    source: inputs/rubric/task-b-rubric.md#line.6
  - text: Going over 50 words. Words past the limit are not marked.
    source: inputs/spec/task-b-spec.md#line.32
