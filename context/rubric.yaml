- id: C5
  name: Study Limitations and Alternative Narrative
  original_wording: Study Limitations and Alternative Narrative (2 marks)
  original_source: inputs/rubric/task-b-rubric.md#line.10
  weight: 2
  applies_to:
  - TB
  cross_cutting: false
  headings: 6–7
  learning_outcomes:
  - ULO1
  - ULO4
  levels:
  - level: HD
    marks:
    - 2
    - 2
    original: Multiple well-explained limitations related to the topic and hypothesis are identified, demonstrating critical reflection. Their impact on findings and conclusions is clearly articulated, and proposed future investigations directly address the limitations identified. A realistic and distinct alternative narrative is provided, supported by specific changes to data selection, methods, or processes, with clear justification for how these changes could produce a different interpretation of the findings. (2 marks)
    observable:
    - 'Limitations: two or more limitations specific to this design and topic (e.g. self-report exposure, sampling frame, cross-sectional design) are each explained, not just named.'
    - 'Impact: each limitation''s effect on the findings or conclusions is stated (e.g. which way it would bias the result, or why it would limit generalisation).'
    - 'Future investigations: each proposed investigation directly addresses a named limitation.'
    - 'Alternative narrative: heading 7 gives a specific hypothetical result that leads to a different conclusion, names the concrete change (participant group, how a variable is measured, data selection or analysis method) that would produce it, and justifies how. It does not restate a null-test outcome or a limitation.'
    sources:
    - inputs/rubric/task-b-rubric.md#line.10
    - inputs/spec/task-b-spec.md#line.14
    - inputs/spec/task-b-spec.md#line.15
    - inputs/clarifications/Assignment-2-faq.md#line.75
    - inputs/clarifications/Assignment-2-faq.md#line.77
    - inputs/clarifications/Assignment-2-faq.md#line.79
  - level: D
    marks:
    - 1.5
    - 1.5
    original: Multiple limitations related to the topic and hypothesis are identified, with some discussion of their impact on findings. A distinct alternative narrative is provided and supported by references to changes in data selection, methods, or processes. Connections between limitations, future investigations, and alternative interpretations are evident, but not fully developed. (1.5 marks)
    observable:
    - 'Limitations: several limitations related to the topic and hypothesis are identified.'
    - 'Impact: there is some discussion of impact.'
    - 'Future investigations: the connections between limitations, future work and alternative interpretations are evident but not fully developed.'
    - 'Alternative narrative: distinct, and supported by references to changes in data selection, methods or processes.'
    sources:
    - inputs/rubric/task-b-rubric.md#line.10
  - level: C
    marks:
    - 1.25
    - 1.25
    original: Limitations relevant to the topic and hypothesis are identified, and an alternative narrative distinct from the original hypothesis is provided. However, the impact of the limitations on findings is unclear, future investigations are not clearly linked to the limitations, and references to alternative data selections, methods, or processes are limited or unclear. (1.25 marks)
    observable:
    - 'Limitations: relevant limitations are identified.'
    - 'Impact: the impact on findings is unclear.'
    - 'Future investigations: not clearly linked to the limitations.'
    - 'Alternative narrative: distinct from the original hypothesis, but references to alternative data selection, methods or processes are limited or unclear.'
    sources:
    - inputs/rubric/task-b-rubric.md#line.10
  - level: P
    marks:
    - 1
    - 1
    original: Limitations are absent, generic, or not related to the topic and hypothesis. An alternative narrative is absent, merely restates the original hypothesis, or is not supported by the data. There is little or no consideration of the impact on findings, future investigations, or how different data selections, methods, or processes may lead to alternative interpretations. (1 mark)
    observable:
    - 'Limitations: absent, generic, or not related to the topic or hypothesis.'
    - 'Impact: little or no consideration.'
    - 'Future investigations: little or none.'
    - 'Alternative narrative: absent, restates the original hypothesis, or is not supported by the data.'
    sources:
    - inputs/rubric/task-b-rubric.md#line.10
    - inputs/clarifications/Assignment-2-faq.md#line.77
  - level: N
    marks:
    - 0
    - 0
    original: No limitations or alternative narrative are provided. (0 marks)
    observable:
