    - inputs/clarifications/task-b-additional-info.md#line.94
    - inputs/clarifications/task-b-additional-info.md#line.103
  - level: D
    marks:
    - 1.5
    - 1.5
    original: The hypothesis and null hypothesis are clearly stated, include named variables, and are logically paired. The predicted relationship and absence of relationship are evident, although wording, precision, or testability could be further refined. (1.5 marks)
    observable:
    - The population, exposure, comparison and outcome are all named, but at least one is imprecise (e.g. 'social media use' with no platform or content type, or 'perceptions' with no measurable construct).
    - The predicted relationship is evident, but the wording could be sharper.
    - H0 is logically paired with H1 but not an exact mirror (e.g. a slightly different population scope or outcome wording).
    - Testability is evident, but measurement or precision could be refined.
    - The hypothesis may include 'significantly'.
    sources:
    - inputs/rubric/task-b-rubric.md#line.6
    - inputs/clarifications/task-b-additional-info.md#line.91
    - inputs/clarifications/task-b-additional-info.md#line.97
  - level: C
    marks:
    - 1.25
    - 1.25
    original: A relevant hypothesis and null hypothesis are provided and broadly related to each other and the topic. However, variables are implicit, the predicted relationship (or absence of relationship) is unclear, and testability is only partially evident. (1.25 marks)
    observable:
    - Both statements relate to the topic and to each other, but the variables are implicit (e.g. 'social media influences young people's housing views').
    - 'The predicted relationship (or its absence in H0) is unclear: no direction, no comparison, or no stated difference or association.'
    - H0 is broadly related to H1 but does not clearly name the absent relationship.
    - 'Testability is only partly evident: it is unclear what would be measured or compared.'
    - Wording problems (e.g. 'significantly') may also be present.
    sources:
